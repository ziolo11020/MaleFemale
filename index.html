<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damy i Dżentelmeni - Gra Towarzyska</title>
    <style>
        :root {
            --damy-color: #e84393;
            --panowie-color: #0984e3;
            --bg-color: #f5f6fa;
            --text-color: #2f3640;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        /* Widoki */
        #setup-view, #game-view, #board-view {
            display: none;
        }
        #setup-view.active, #game-view.active, #board-view.active {
            display: block;
        }

        /* Przyciski */
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            color: white;
        }
        .btn-damy { background-color: var(--damy-color); }
        .btn-panowie{ background-color: var(--panowie-color); }
        .btn-start { background-color: #44bd32; font-size: 22px; width: 100%; margin: 20px 0 0 0;}
        .btn-start:disabled { background-color: #7f8fa6; cursor: not-allowed; }
        
        .action-btns {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }
        .btn-correct { background-color: #4cd137; font-size: 40px; width: 45%; height: 100px; }
        .btn-wrong { background-color: #e84118; font-size: 40px; width: 45%; height: 100px; }

        /* Gra */
        #timer {
            font-size: 48px;
            font-weight: bold;
            color: #e1b12c;
            margin: 20px 0;
        }
        #word-display {
            font-size: 36px;
            font-weight: bold;
            margin: 30px 0;
            min-height: 50px;
        }

        /* Plansza */
        .track {
            background-color: #dcdde1;
            height: 40px;
            border-radius: 20px;
            margin: 20px 0;
            position: relative;
        }
        .pawn {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            position: absolute;
            top: 0;
            transition: left 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transform: translateX(-50%);
        }
        .pawn-damy { background-color: var(--damy-color); }
        .pawn-panowie { background-color: var(--panowie-color); }
        .score-label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
        }

        .selected {
            border: 4px solid #f1c40f;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Damy i Dżentelmeni 👑</h1>

    <!-- WIDOK 1: USTAWIENIA -->
    <div id="setup-view" class="active">
        <h2>Kto zaczyna grę?</h2>
        <button id="btn-select-damy" class="btn-damy" onclick="selectTeam('damy')">Damy 👩</button>
        <button id="btn-select-panowie" class="btn-panowie" onclick="selectTeam('panowie')">Dżentelmeni 👨</button>
        
        <div style="margin-top: 40px;">
            <button id="btn-start-game" class="btn-start" onclick="showBoard()" disabled>Rozpocznij grę!</button>
        </div>
    </div>

    <!-- WIDOK 2: PLANSZA -->
    <div id="board-view">
        <h2>Aktualna sytuacja (Cel: 100)</h2>
        
        <div class="score-label">
            <span style="color: var(--damy-color);">Damy: <span id="score-damy">0</span></span>
        </div>
        <div class="track">
            <div id="pawn-damy" class="pawn pawn-damy" style="left: 0%;">👩</div>
        </div>

        <div class="score-label">
            <span style="color: var(--panowie-color);">Dżentelmeni: <span id="score-panowie">0</span></span>
        </div>
        <div class="track">
            <div id="pawn-panowie" class="pawn pawn-panowie" style="left: 0%;">👨</div>
        </div>

        <h3 id="turn-announcement" style="margin-top: 30px;"></h3>
        <button class="btn-start" onclick="startTurn()">Start Rundy (1 Minuta)</button>
    </div>

    <!-- WIDOK 3: GRA -->
    <div id="game-view">
        <h2 id="current-team-display"></h2>
        <div id="timer">60</div>
        <div id="word-display">Ładowanie...</div>
        
        <div class="action-btns">
            <button class="btn-wrong" onclick="handleAnswer(false)">❌</button>
            <button class="btn-correct" onclick="handleAnswer(true)">✅</button>
        </div>
    </div>

</div>

    let availableWomensWords = [...haslaDamskie];

    // Zmiana widoków
    function switchView(viewId) {
        document.getElementById('setup-view').classList.remove('active');
        document.getElementById('board-view').classList.remove('active');
        document.getElementById('game-view').classList.remove('active');
        document.getElementById(viewId).classList.add('active');
    }

    // Wybór drużyny
    function selectTeam(team) {
        currentTeam = team;
        document.getElementById('btn-select-damy').classList.remove('selected');
        document.getElementById('btn-select-panowie').classList.remove('selected');
        document.getElementById('btn-select-' + team).classList.add('selected');
        document.getElementById('btn-start-game').disabled = false;
    }

    // Przejście na planszę
    function showBoard() {
        updateBoardUI();
        
        // Sprawdź czy ktoś wygrał
        if (scores.damy >= 100 || scores.panowie >= 100) {
            let winner = scores.damy >= 100 ? "Damy" : "Dżentelmeni";
            document.getElementById('turn-announcement').innerHTML = `🏆 KONIEC GRY! WYGRYWAJĄ ${winner.toUpperCase()}! 🏆`;
            document.querySelector('#board-view button').style.display = 'none';
        } else {
            let teamName = currentTeam === 'damy' ? "👩 Damy" : "👨Dżentelmeni";
            document.getElementById('turn-announcement').innerText = `Kolej na: ${teamName}`;
        }
        
        switchView('board-view');
    }

    // Aktualizacja planszy
    function updateBoardUI() {
        document.getElementById('score-damy').innerText = scores.damy;
        document.getElementById('score-panowie').innerText = scores.panowie;
        
        // Obliczanie pozycji w % (maksymalnie 100%)
        let posDamy = Math.min(scores.damy, 100);
        let posPanowie = Math.min(scores.panowie, 100);
        
        document.getElementById('pawn-damy').style.left = posDamy + '%';
        document.getElementById('pawn-panowie').style.left = posPanowie + '%';
    }

    // Start Rundy
    function startTurn() {
        currentRoundScore = 0;
        timeLeft = 60;
        document.getElementById('timer').innerText = timeLeft;
        
        let teamDisplay = currentTeam === 'damy' ? "Grają Damy 👩 (Zgadują męskie hasła)" : "Grają Panowie 👨 (Zgadują damskie hasła)";
        document.getElementById('current-team-display').innerText = teamDisplay;
        
        showNextWord();
        switchView('game-view');

        // Odliczanie czasu
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            
            if (timeLeft <= 0) {
                endTurn();
            }
        }, 1000);
    }

    // Losowanie hasła
    function showNextWord() {
        let wordList = currentTeam === 'damy' ? availableMensWords : availableWomensWords;
        
        // Jeśli pula haseł się wyczerpała, zresetuj ją
        if (wordList.length === 0) {
            if(currentTeam === 'damy') {
                availableMensWords = [...haslaMeskie];
                wordList = availableMensWords;
            } else {
                availableWomensWords = [...haslaDamskie];
                wordList = availableWomensWords;
            }
        }

        // Losowanie
        let randomIndex = Math.floor(Math.random() * wordList.length);
        let word = wordList[randomIndex];
        
        // Usunięcie wylosowanego hasła z puli
        wordList.splice(randomIndex, 1);
        
        document.getElementById('word-display').innerText = word;
    }

    // Obsługa przycisków ✅ i ❌
    function handleAnswer(isCorrect) {
        if (isCorrect) {
            currentRoundScore++;
        }
        showNextWord();
    }

    // Koniec rundy
    function endTurn() {
        clearInterval(timerInterval);
        
        // Zapisanie punktów
        scores[currentTeam] += currentRoundScore;
        alert(`Czas minął! Zdobyte punkty: ${currentRoundScore}`);
        
        // Zmiana drużyny na następną
        currentTeam = currentTeam === 'damy' ? 'dżentelmeni' : 'damy';
        
        showBoard();
    }

</script>
</body>
</html>
